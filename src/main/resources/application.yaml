server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

feign:
  client:
    config:
      default:
        logger-level: FULL

logging:
  level:
    root: INFO
    com.stayease.auth_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    com.stayease.auth_service.config.OwnerClient: DEBUG
    com.stayease.auth_service.config.UserClient: DEBUG
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
        ignore-exceptions:
          - jakarta.validation.ValidationException
          - java.lang.IllegalArgumentException

    instances:
      user-service:
        base-config: default
      owner-service:
        base-config: default

  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.net.SocketTimeoutException
          - java.net.ConnectException

    instances:
      user-service:
        base-config: default

      owner-service:
        base-config: default
spring:
  application:
    name: auth-service
  profiles:
    active: local

  secret: stayease-super-secret-key-for-jwt-authentication-2026-secure-key

  mail:
    host: smtp.gmail.com
    port: 587
    username: MY Username
    password: MY PWD
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/stayease_auth_db
    username: root
    password: 2000030757
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

services:
  user-service:
    url: http://localhost:8082
  owner-service:
    url: http://localhost:8083

